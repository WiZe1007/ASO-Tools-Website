<style>html,body{background:#030406;color-scheme:dark}</style>
<script nonce="{{ csp_nonce }}">
(() => {
  const root = document.documentElement;
  const read = key => { try { return localStorage.getItem(key); } catch (_) { return null; } };
  root.dataset.wwaDatabase = 'true';
  root.dataset.theme = (read('wwa-db-theme') || read('wwa.aso.tools.theme') || read('wwa-theme')) === 'dark' ? 'dark' : 'light';
  root.dataset.motion = matchMedia('(prefers-reduced-motion: reduce)').matches || read('wwa.tools.liquid-motion') === 'paused' ? 'paused' : 'playing';
})();
</script>
