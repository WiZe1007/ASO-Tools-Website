{% macro controls(theme_id='themeButton') %}
{% from 'shared/icons.html' import icon %}
<button class="icon-button db-motion-button" data-motion-toggle type="button" aria-label="Призупинити анімацію" title="Призупинити анімацію" aria-pressed="false">
  {{ icon('pause', 20, 'db-motion-pause') }}
  {{ icon('play', 20, 'db-motion-play') }}
</button>
<button class="icon-button db-theme-button" id="{{ theme_id }}" data-db-theme type="button" aria-label="Змінити тему" title="Змінити тему">
  <span class="db-theme-sun">{{ icon('sun') }}</span><span class="db-theme-moon">{{ icon('moon') }}</span>
</button>
{% endmacro %}
