<!doctype html>
<html lang="uk" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Вхід | WWA Apps Database</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='db/data-base-favicon.png', v='20260804') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='db/data-base-favicon.png', v='20260804') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='db/database-site.css') }}">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-brand" aria-label="WWA Apps Database">
      <img src="{{ url_for('static', filename='img/WWA_icon_1024.png') }}" alt="WWA">
      <div>
        <strong>WWA Apps Database</strong>
        <span>Internal workspace</span>
      </div>
    </section>

    <section class="auth-card">
      <div class="auth-heading">
        <span class="eyebrow">Корпоративний доступ</span>
        <h1>Увійти до бази</h1>
        <p>Використовуй корпоративну пошту та пароль, надані адміністратором.</p>
      </div>

      {% if error %}<div class="form-alert" role="alert">{{ error }}</div>{% endif %}

      <form method="post" class="auth-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label>
          <span>Корпоративна пошта</span>
          <input type="email" name="email" value="{{ email }}" placeholder="name{{ domain }}" autocomplete="email" required autofocus>
        </label>
        <label>
          <span>Пароль</span>
          <input type="password" name="password" placeholder="Пароль" autocomplete="current-password" required>
        </label>
        <button class="primary-button full-button" type="submit">Увійти</button>
      </form>

      <p class="auth-switch">
        Для отримання доступу звернися до адміністратора.
      </p>
    </section>
  </main>
</body>
</html>
