<section id="ratingScan" class="rating-scan" role="status" aria-live="polite" hidden>
  <div class="rating-scan__visual" aria-hidden="true">
    <div class="rating-scan__halo"></div>
    <div class="rating-scan__plane rating-scan__plane--one"><div class="rating-scan__orbit"><i></i><i></i></div></div>
    <div class="rating-scan__plane rating-scan__plane--two"><div class="rating-scan__orbit"><i></i><i></i></div></div>
    <div class="rating-scan__sphere">
      <svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="1.2">
        <circle cx="60" cy="60" r="40" />
        <ellipse cx="60" cy="60" rx="18" ry="40" />
        <ellipse cx="60" cy="60" rx="40" ry="16" />
        <path d="M20 60h80M60 20v80" />
      </svg>
      <span class="rating-scan__gloss"></span>
    </div>
    <span class="rating-scan__spark rating-scan__spark--one"></span>
    <span class="rating-scan__spark rating-scan__spark--two"></span>
    <span class="rating-scan__spark rating-scan__spark--three"></span>
  </div>
  <div class="rating-scan__copy">
    <div class="rating-scan__meta">
      <span id="ratingScanMode">App Magic</span>
      <span class="rating-scan__elapsed" aria-hidden="true"><span>Час перевірки</span><time id="ratingScanTime">00:00</time></span>
    </div>
    <h2>Перевіряємо ваш додаток</h2>
    <p id="ratingScanMessage">Збираємо рейтинги у різних країнах.</p>
    <div class="rating-scan__signal" aria-hidden="true"><span></span></div>
    <p class="rating-scan__hint" id="ratingScanHint">Результати з’являться автоматично.</p>
  </div>
</section>
